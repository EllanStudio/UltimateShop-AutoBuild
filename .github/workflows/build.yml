name: Build on Push

on:
  push:
    branches:
      - 'feature/new-branch'
      - 'chore/minecraft-26.3'
  pull_request:
  workflow_dispatch:

env:
  BUILD_JAVA_VERSION: '25'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        paper-version: ['26.2.build.130-stable', '26.3.build.157-beta']
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download external API jars
        run: |
          set -euo pipefail
          validate_jar() {
            local f="$1"
            [ -s "$f" ] && unzip -tq "$f" >/dev/null 2>&1
          }
          download_or_keep() {
            local url="$1"
            local target="$2"
            local name="$3"
            local temporary="${target}.download"
            rm -f "$temporary"
            echo "Downloading $name..."
            if curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 300 \
              -o "$temporary" "$url" && validate_jar "$temporary"; then
              mv -f "$temporary" "$target"
              return 0
            fi
            rm -f "$temporary"
            if validate_jar "$target"; then
              echo "  -> $name download unavailable; using existing valid local JAR"
              return 0
            fi
            rm -f "$target"
            echo "::error::Unable to obtain a valid $name JAR"
            return 1
          }
          download_or_keep \
            "https://raw.githubusercontent.com/ManyouTeam/UltimateShop/master/core/lib/AdvancedEnchantmentsAPI.jar" \
            core/lib/AdvancedEnchantmentsAPI.jar "AdvancedEnchantments-API"
          download_or_keep \
            "https://drive.google.com/uc?export=download&id=1hKDkZg9yOJZydd2WugaAi9nfWspwEqJr" \
            core/lib/RoyaleEconomyAPI.jar "RoyaleEconomyAPI"
          download_or_keep \
            "https://cdn.modrinth.com/data/ZfcV7L06/versions/ddOkhdsg/SCore-5.26.5.17.jar?mr_download_reason=standalone" \
            core/lib/SCore-5.26.5.17.jar "SCore"
          download_or_keep \
            "https://cdn.modrinth.com/data/g8Zwnnmn/versions/YzKhzwRI/ExecutableItems-7.26.5.17.jar?mr_download_reason=standalone" \
            core/lib/ExecutableItems-7.26.5.17.jar "ExecutableItems"
          download_or_keep \
            "https://raw.githubusercontent.com/ManyouTeam/UltimateShop/master/core/lib/LegacyCodesCompatibility.jar" \
            core/lib/LegacyCodesCompatibility.jar "LegacyCodesCompatibility"

      - name: Build with Gradle
        run: |
          gradle :paper:testSwingAnimationResolver --no-daemon -PpaperVersion=${{ matrix.paper-version }}
          gradle :core:testMath --no-daemon
          gradle :core:testDecay --no-daemon
          gradle :core:testDecayExtended --no-daemon
          gradle :core:testPureUtils --no-daemon
          gradle clean shadowJar --no-daemon -PpaperVersion=${{ matrix.paper-version }}
          echo "Paper API matrix: ${{ matrix.paper-version }}"
          if ! javap -verbose -classpath core/build/classes/java/main \
            cn.superiormc.ultimateshop.hooks.economy.EconomyExcellentEconomyHook \
            | grep "major version: 65" >/dev/null; then
            echo "Build output is not compatible with Java 21"
            exit 1
          fi
          JAR_FILE=$(find plugin/build/libs -name "UltimateShop-*.jar" ! -name "*sources.jar" ! -name "*javadoc.jar" | head -1)
          if [ -n "$JAR_FILE" ]; then
            echo "Build successful!"
            ls -lh "$JAR_FILE"
            unzip -tq "$JAR_FILE" >/dev/null
            unzip -p "$JAR_FILE" plugin.yml | grep -E '^main:|^api-version:'
          else
            echo "Build failed - no JAR file found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UltimateShop-Build-${{ matrix.paper-version }}
          path: |
            plugin/build/libs/UltimateShop-*.jar
            !plugin/build/libs/*-sources.jar
            !plugin/build/libs/*-javadoc.jar
          retention-days: 30